<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Store promo tile</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    padding: 34px 32px; background: linear-gradient(135deg, #0d1117, #12261c);
    color: #e6edf3; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0; font-size: 38px; letter-spacing: -0.02em; line-height: 1.05; }
  .sub { color: #9da7b3; font-size: 18px; margin: 6px 0 26px; }
  .grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); grid-auto-columns: 11px; gap: 3px; }
  .grid i { border-radius: 2px; }
</style>
</head>
<body>
  <h1>Comment Streak</h1>
  <div class="sub">for LinkedIn · daily comment heatmap</div>
  <div class="grid" id="grid"></div>
  <script>
    const shades = ["#1c2128", "#0e4429", "#006d32", "#26a641", "#39d353"];
    const rand = (s) => { const x = Math.sin(s * 12.9898) * 43758.5453; return x - Math.floor(x); };
    const grid = document.getElementById("grid");
    const weeks = 27;
    for (let w = 0; w < weeks; w++) for (let d = 0; d < 7; d++) {
      const p = w / weeks, r = rand(w * 7 + d + 1);
      const lvl = r < 0.55 - 0.45 * p ? 0 : Math.min(4, 1 + Math.floor(rand(w * 31 + d) * (1.5 + 3 * p)));
      const cell = document.createElement("i");
      cell.style.background = shades[lvl];
      grid.append(cell);
    }
  </script>
</body>
</html>
